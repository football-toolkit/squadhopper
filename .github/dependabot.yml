version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # Majors stay one PR each, so a breaking one can be reviewed on its own.
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Its major follows the Node runtime in .nvmrc, so it moves with a Node upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
