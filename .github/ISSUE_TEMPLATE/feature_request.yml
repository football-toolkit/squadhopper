name: Feature request
description: Suggest a new feature or an improvement.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, or what need does it meet?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it's done?
      placeholder: |
        - [ ] ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
