name: Feature request
description: "Change what the app does: its business spec changes."
type: Feature
body:
  - type: input
    id: slug
    attributes:
      label: Slug
      description: 2–4 words, kebab-case (e.g. clash-days). The branch will be <issue-number>-<slug>.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, or what need does it meet?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it's done?
      placeholder: |
        - [ ] ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
