name: Feature request
description: "Change what the app does: its business spec changes."
type: Feature
body:
  - type: input
    id: slug
    attributes:
      label: Slug
      description: 2–4 words, kebab-case (e.g. clash-days). The branch will be <issue-number>-<slug>.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "1–3 sentences, from the user's point of view"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "What the user should see or be able to do. No technology. Write 'to be explored' if unclear"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "2–5 observable checks, as checkboxes"
      placeholder: |
        - [ ] ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
