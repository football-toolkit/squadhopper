name: Bug report
description: The app doesn't do what its spec says.
type: Bug
body:
  - type: input
    id: slug
    attributes:
      label: Slug
      description: 2–4 words, kebab-case (e.g. short-change-name). The branch will be <issue-number>-<slug>.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, app version, or anything else relevant.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or links.
