name: Task
description: "Everything else: the spec doesn't change and nothing is broken."
type: Task
body:
  - type: input
    id: slug
    attributes:
      label: Slug
      description: 2–4 words, kebab-case (e.g. short-change-name). The branch will be <issue-number>-<slug>.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why does it need to be done?
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How will we know it's done?
      placeholder: |
        - [ ] ...
    validations:
      required: true
