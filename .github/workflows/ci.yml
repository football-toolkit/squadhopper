name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The main ruleset requires this job by name. Renaming it breaks the required check.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0

      # A temporary Supabase for the end-to-end tests. It starts in the
      # background, so its start overlaps the next steps, and records its exit
      # status for "Wait for Supabase". Only Postgres, auth and the API gateway
      # run.
      - name: Start Supabase
        run: |
          (
            status=0
            supabase start -x realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor || status=$?
            echo "$status" > "$RUNNER_TEMP/supabase-start.exit.tmp"
            mv "$RUNNER_TEMP/supabase-start.exit.tmp" "$RUNNER_TEMP/supabase-start.exit"
          ) > "$RUNNER_TEMP/supabase-start.log" 2>&1 &

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # The keys are the local stack's fixed development keys, not secrets.
      - name: Wait for Supabase
        timeout-minutes: 5
        run: |
          until [ -f "$RUNNER_TEMP/supabase-start.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/supabase-start.log"
          test "$(cat "$RUNNER_TEMP/supabase-start.exit")" = 0
          env_out="$(supabase status -o env)"
          eval "$env_out"
          test -n "$API_URL"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "APP_ENV=test"
          } >> "$GITHUB_ENV"

      - name: End-to-end tests
        id: e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
